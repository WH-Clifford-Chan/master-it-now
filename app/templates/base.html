<!DOCTYPE html>
<html lang="{{ LANGUAGE }}">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ _("Master It Now") }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/responsive.css') }}">
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">

    <div class="top-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="{{ _("Logo") }}">
        <div class="center-text">{{ _("Master It Now") }}</div>
    </div>

    <div class="top-right">

        <!-- LANGUAGE DROPDOWN (instant switch) 
        <select class="lang-select" id="langSelect">

            <option value="en" {% if LANGUAGE == 'en' %}selected{% endif %}>{{ _("English") }}</option>
            <option value="fr" {% if LANGUAGE == 'fr' %}selected{% endif %}>{{ _("Français") }}</option>
            <option value="zh_TW" {% if LANGUAGE == 'zh_TW' %}selected{% endif %}>繁體中文</option>
            <option value="zh_CN" {% if LANGUAGE == 'zh_CN' %}selected{% endif %}>简体中文</option>
            <option value="ja" {% if LANGUAGE == 'ja' %}selected{% endif %}>日本語</option>

        </select> -->

        <div class="profile-container">
            <input type="checkbox" id="profile-toggle" class="profile-toggle">
            <label for="profile-toggle" class="profile-icon">👤</label>

            <div class="dropdown-menu">

                <div class="dropdown-header">
                    {{ user }}
                </div>

                <div class="dropdown-divider"></div>

                <a href="{{ url_for('auth.logout') }}">{{ _("Logout") }}</a>

            </div>
        </div>

    </div>

</div>

<!--SIDEBAR-->
<div class="sidebar">

    <h2>{{ _("Menu") }}</h2>

    <a href="{{ url_for('main.quizzes') }}" class="active">
        {{ _("Quizzes") }}
    </a>

    <a href="{{ url_for('main.flashcard_sets') }}">
        {{ _("Flashcards") }}
    </a>

    <a href="{{ url_for('import.ai_import') }}">
        {{ _("Create New Set with AI") }}
    </a>

    <h2>{{ _("Utilities") }}</h2>

    <a href="{{ url_for('taskplanner.task_planner') }}">
        {{ _("Task Planner") }}
    </a>

</div>
