<!DOCTYPE html>
<html lang="{{ LANGUAGE }}">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">


    <title>{% block title %}{{ _("Master It Now") }}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main/desktop/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/desktop/responsive.css') }}">
</head>

<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-left">
            <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="{{ _("Logo") }}">
            <div class="center-text">{{ _("Master It Now") }}</div>
        </div>
        <div class="top-right">
            <div class="profile-container">
                <input type="checkbox" id="profile-toggle" class="profile-toggle">
                <label for="profile-toggle" class="profile-icon">👤</label>
                <div class="dropdown-menu">
                    <div class="dropdown-header">{{ user }}</div>
                    <div class="dropdown-divider"></div>
                    <a href="{{ url_for('settings.settings') }}">{{ _("Settings") }}</a>
                    <a href="{{ url_for('auth.logout') }}">{{ _("Logout") }}</a>
                </div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>{{ _("Menu") }}</h2>
        <a href="{{ url_for('main.flashcard_sets') }}">{{ _("Flashcards") }}</a>
        <a href="{{ url_for('main.quizzes') }}">{{ _("Quizzes") }}</a>
        <a href="{{ url_for('import.ai_import') }}">{{ _("Create New Set with AI") }}</a>

        <h2>{{ _("Utilities") }}</h2>
        <a href="{{ url_for('taskplanner.task_planner') }}">{{ _("Task Planner") }}</a>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/menu_script.js') }}" defer></script>

    {% block scripts %}{% endblock %}

</body>
</html>
