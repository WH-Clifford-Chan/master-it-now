<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Remember It Now</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles/login.css') }}">
</head>
<body>
<div class="top-bar">
<div class="top-left">
<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="Logo">
<div class="brand">Remember It Now</div>
</div>
<div class="top-right">
<a class="nav-link" href="{{ url_for('homepage.home') }}">Home</a>
<a class="nav-link" href="{{ url_for('auth.account_creation') }}">Sign Up</a>
</div>
</div>
<main class="page-shell">
<section class="center-card">
<h1>Login</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}

                    {% endfor %}
                {% endif %}
            {% endwith %}
<form method="POST" class="form-grid">
<label for="username">Username</label>
<input id="username" type="text" name="username" required>
<label for="password">Password</label>
<input id="password" type="password" name="password" required>
<button type="submit" class="primary-button">Login</button>
</form>
<p class="muted-text">New here? <a href="{{ url_for('auth.account_creation') }}">Create an account</a></p>
</section>
</main>
</body>
</html>
