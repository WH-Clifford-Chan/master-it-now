<!DOCTYPE html>
<html lang="{{ LANGUAGE }}">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ _("Login") }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/responsive.css') }}">
</head>

<body>

<div class="top-bar">

    <div class="top-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="{{ _("Logo") }}">
        <div class="brand">{{ _("Master It Now") }}</div>
    </div>

    <div class="top-right">

        <a class="nav-link" href="{{ url_for('homepage.home') }}">
            {{ _("Home") }}
        </a>

        <a class="nav-link" href="{{ url_for('auth.account_creation') }}">
            {{ _("Sign Up") }}
        </a>

    </div>

</div>

<main class="page-shell">

<section class="center-card">

    <h1>{{ _("Login") }}</h1>

    <!--ERROR-->
        <p class="error-msg">
        {% if error %}
          {{ _("Invalid username or password/Account does not exist.") }}
        {% endif %}
        </p>

    <form method="POST" class="form-grid">

        <label for="username">{{ _("Username") }}</label>
        <input id="username" type="text" name="username" class="text-box" required>

        <label for="password">{{ _("Password") }}</label>
        <input id="password" type="password" name="password" class="text-box" required>

        <button type="submit" class="primary-button">
            {{ _("Login") }}
        </button>

    </form>

    <p class="muted-text">
        {{ _("New here?") }}
        <a href="{{ url_for('auth.account_creation') }}">
            {{ _("Create an account") }}
        </a>
    </p>

</section>

</main>

<script>
document.getElementById("langSelect").addEventListener("change", async function () {
    const lang = this.value;

    try {
        await fetch(`/lang/${lang}`, {
            method: "GET",
            credentials: "same-origin"
        });

        window.location.reload();

    } catch (err) {
        console.error("Language switch failed:", err);
    }
});
</script>

</body>
</html>
