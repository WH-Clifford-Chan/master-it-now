<!DOCTYPE html>
<html lang="{{ LANGUAGE }}">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ _("Create Account") }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/auth/mobile/account_creation.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/responsive.css') }}">
</head>

<body>

<div class="top-bar">

    <div class="top-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="{{ _("Logo") }}">
        <div class="brand">{{ _("Master It Now") }}</div>
    </div>

    <div class="top-right">

        <!-- LANGUAGE DROPDOWN (instant switch) 
        <select class="lang-select" id="langSelect">

            <option value="en" {% if LANGUAGE == 'en' %}selected{% endif %}>{{ _("English") }}</option>
            <option value="fr" {% if LANGUAGE == 'fr' %}selected{% endif %}>{{ _("Français") }}</option>
            <option value="zh_TW" {% if LANGUAGE == 'zh_TW' %}selected{% endif %}>繁體中文</option>
            <option value="zh_CN" {% if LANGUAGE == 'zh_CN' %}selected{% endif %}>简体中文</option>
            <option value="ja" {% if LANGUAGE == 'ja' %}selected{% endif %}>日本語</option>

        </select> -->

        <a class="nav-link" href="{{ url_for('homepage.home') }}">
            {{ _("Home") }}
        </a>

        <a class="nav-link" href="{{ url_for('auth.login') }}">
            {{ _("Login") }}
        </a>

    </div>

</div>

<main class="page-shell">

<section class="center-card">

    <h1>{{ _("Create Your Account") }}</h1>

    <p class="page-copy">
        {{ _("Start remembering what matters with quick, simple flashcard practice.") }}
    </p>

    <!--ERROR-->
        <p class="error-msg">
        {% if error %}
          {{ _("Username already taken") }}
        {% endif %}
        </p>

    <form method="post" class="form-grid">

        <label for="username">{{ _("Username") }}</label>
        <input id="username" type="text" name="username" class="text-box" required>

        <label for="password">{{ _("Password") }}</label>
        <input id="password" type="password" name="password" class="text-box" required>

        <button type="submit" class="primary-button">
            {{ _("Create Account") }}
        </button>

    </form>

    <p class="muted-text">
        {{ _("Already have an account?") }}
        <a href="{{ url_for('auth.login') }}">{{ _("Log in") }}</a>
    </p>

</section>

</main>

<script>
document.getElementById("langSelect").addEventListener("change", async function () {
    const lang = this.value;

    try {
        await fetch(`/lang/${lang}`, {
            method: "GET",
            credentials: "same-origin"
        });

        window.location.reload();

    } catch (err) {
        console.error("Language switch failed:", err);
    }
});
</script>

</body>
</html>
