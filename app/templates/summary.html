<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Summary | Remember It Now</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles/summary.css') }}">
</head>

<body>

<div class="top-bar">
    <div class="top-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="Logo">
        <div class="brand">Remember It Now</div>
    </div>
</div>

<main class="summary-shell">
<section class="summary-card">

    <h1>Quiz Summary</h1>

    <div class="summary-grid">
        <article>
            <h2>Correct</h2>
            <p>{{ correct }}</p>
        </article>

        <article>
            <h2>Incorrect</h2>
            <p>{{ incorrect }}</p>
        </article>

        <article>
            <h2>Reviewed</h2>
            <p>{{ reviewed }}</p>
        </article>
    </div>

    <div class="summary-actions">

        {% if set_id %}
        <form method="POST" action="{{ url_for('quiz.reset_quiz', set_id=set_id) }}">
            <button type="submit" class="primary-button">
                Back to Dashboard
            </button>
        </form>
        {% endif %}

    </div>

</section>
</main>

</body>
</html>
