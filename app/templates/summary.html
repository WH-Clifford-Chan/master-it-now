<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ _("Summary") }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/summary.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/responsive.css') }}">
</head>

<body>

<div class="top-bar">

    <div class="top-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="{{ _("Logo") }}">
        <div class="brand">{{ _("Master It Now") }}</div>
    </div>

</div>

<main class="summary-shell">

<section class="summary-card">

    <h1>{{ _("Flashcard Summary") }}</h1>

    <div class="summary-grid">

        <article>
            <h2>{{ _("Correct") }}</h2>
            <p>{{ correct }}</p>
        </article>

        <article>
            <h2>{{ _("Incorrect") }}</h2>
            <p>{{ incorrect }}</p>
        </article>

        <article>
            <h2>{{ _("Reviewed") }}</h2>
            <p>{{ reviewed }}</p>
        </article>

    </div>

    <div class="summary-actions">

        {% if set_id %}

        <a href="{{ url_for('main.quizzes') }}" class="primary-button">
            {{ _("Back to Dashboard") }}
        </a>

        {% endif %}

    </div>

</section>

</main>

</body>
</html>
