<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload CSV | Remember It Now</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles/upload.css') }}">
</head>
<body>
<div class="top-bar">
<div class="top-left">
<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="Logo">
<div class="center-text">Remember It Now</div>
</div>
<div class="top-right">
<div class="profile-container">
<input type="checkbox" id="profile-toggle" class="profile-toggle">
<label for="profile-toggle" class="profile-icon">
                    👤
</label>
<div class="dropdown-menu">
<a href="{{ url_for('auth.logout') }}">Logout</a>
</div>
</div>
</div>
</div>
<div class="sidebar">
<h2>Menu</h2>
<a href="{{ url_for('main.dashboard') }}">
            Sets
</a>
<a href="{{ url_for('import.form_import') }}" class="active">
            Sets Upload
</a>
<a href="{{ url_for('main.ai_courses') }}">
            AI Powered Courses
</a>
<a href="{{ url_for('main.ai_upload') }}">
            AI Courses - Upload
</a>
</div>
<main class="upload-shell">
<section class="upload-card">
<h1>Upload Your Set</h1>
<p class="page-copy">
                Add a CSV file with terms and definitions to begin practicing immediately.
</p>
            {% if error %}
<p class="error-message">{{ error }}</p>
            {% endif %}
<form method="POST" enctype="multipart/form-data" class="form-grid">
<label for="set_name">Set Name</label>
<input id="set_name" type="text" name="set_name" placeholder="Example: SAT Vocabulary" required>
<label for="csv_file">Select CSV File</label>
<input id="csv_file" type="file" name="csv_file" accept=".csv" required>
<button type="submit" class="primary-button">
                    Upload CSV
</button>
</form>
<p class="muted-text">
                CSV format:
<br>
                term,definition
</p>
</section>
</main>
</body>
</html>
