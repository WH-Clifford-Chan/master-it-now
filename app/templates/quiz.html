<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles/quiz.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/responsive.css') }}">
</head>
<body>
<div class="top-bar">
<div class="top-left">
<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="Logo">
<div class="brand">Master It Now</div>
</div>
    <div class="top-right">
        <a class="back-button" href="{{ url_for('main.dashboard') }}">Back</a>
    </div>
</div>
</div>
</div>
<main class="quiz-shell">
<section class="quiz-card">
    <div class="quiz-header">
    <div>
    <p class="section-label">Question</p>
    <h1>{{ (session.index or 0) + 1 }} / {{ total_words }}</h1>
    </div>
    <p class="status-chip"></p>
    </div>
    <p class="term-label">What is the definition of:</p>
    <div class="term-box">{{ term }}</div>
    <form method="post" class="form-grid">
    <label for="answer">Your answer</label>
    <input id="answer" type="text" name="answer" autocomplete="off" class="text-box" required autofocus>
    <button type="submit" class="primary-button">Submit Answer</button>
    </form>
                {% if feedback %}
                    <div class="feedback-box {% if correct %}correct{% else %}wrong{% endif %}">
                        {{ feedback }}
                    </div>
                {% endif %}
</section>
</main>
</body>
<script>
    document.getElementById("answer").focus();
</script>
</html>
