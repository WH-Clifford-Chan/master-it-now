<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <title>{% block title %}Master It Now{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/top_bar.css') }}">
</head>

<body>

<div class="top-bar">
    <div class="top-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="Logo">
        <div class="center-text">Master It Now</div>
    </div>
</div>

<div class="page-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
